<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c3d2c" />
    <title>ابزارها | کارجوی هرات</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="tools">
    <main class="wrap">
      <div class="page-hero">
        <h1>ابزارها</h1>
        <p>ماشین حساب، نرخ اسعار و خدمات سریع کارجوی هرات.</p>
      </div>
      <div class="tool-grid">
        <a class="tool-btn" href="#calc"><span>🧮</span>ماشین حساب</a>
        <a class="tool-btn" href="#fx"><span>💱</span>نرخ اسعار</a>
        <a class="tool-btn" href="#sos"><span>📞</span>شماره اضطراری</a>
        <a class="tool-btn" href="#post"><span>📝</span>ثبت آگهی</a>
      </div>

      <h2 id="calc" style="font-size:16px;margin:18px 0 8px">ماشین حساب</h2>
      <div class="calc">
        <input id="calc-out" value="۰" readonly />
        <div class="calc-keys" id="calc-keys"></div>
      </div>

      <h2 id="fx" style="font-size:16px;margin:18px 0 8px">تبدیل افغانی و دالر</h2>
      <div class="form-card">
        <label>مبلغ (افغانی)</label>
        <input id="afn" type="number" value="1000" />
        <label>نرخ یک دالر به افغانی</label>
        <input id="rate" type="number" value="68" />
        <p id="fx-out" class="sub">حدود ۱۴.۷ دالر</p>
      </div>

      <h2 id="sos" style="font-size:16px;margin:18px 0 8px">شماره‌های اضطراری هرات</h2>
      <div class="list-card"><h3>امبولانس</h3><p class="sub">۱۱۲ / ۰۴۰۲۲۰۰۰۰</p><a class="btn-call" href="tel:112">تماس</a></div>
      <div class="list-card"><h3>پولیس</h3><p class="sub">۱۱۹</p><a class="btn-call" href="tel:119">تماس</a></div>
      <div class="list-card"><h3>آتش‌نشانی</h3><p class="sub">۱۱۰</p><a class="btn-call" href="tel:110">تماس</a></div>

      <h2 id="post" style="font-size:16px;margin:18px 0 8px">ثبت آگهی سریع</h2>
      <form class="form-card" id="post-form">
        <label>عنوان</label>
        <input name="title" required />
        <label>شرکت</label>
        <input name="company" required />
        <label>شماره تماس</label>
        <input name="phone" required />
        <button type="submit">ارسال</button>
      </form>
    </main>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
