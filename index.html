<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>کارجوی هرات | کاریابی ولایت هرات</title>
    <meta
      name="description"
      content="تازه‌ترین آگهی‌های کار و استخدام در ولایت هرات. جستجو، فیلتر و تماس مستقیم با کارفرما از طریق تلگرام و واتساپ."
    />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <a class="skip" href="#feed">رفتن به آگهی‌ها</a>
    <main class="wrap">
      <div class="mobile-search">
        <input data-search type="search" placeholder="جستجوی شغل، شرکت یا مهارت…" aria-label="جستجو" />
      </div>

      <section class="hero-banner" aria-label="تبلیغات ویژه">
        <img id="banner-img" src="assets/banner-1.jpg" alt="بنر ۱" />
        <div class="overlay">
          <span class="kicker" id="banner-kicker">تبلیغات ویژه</span>
          <h2 id="banner-title">فرصت‌های شغلی ولایت هرات</h2>
          <p id="banner-text">توضیحات بنر تبلیغاتی</p>
        </div>
        <div class="dots" id="dots"></div>
      </section>

      <section class="stats" aria-label="آمار">
        <div class="stat"><b id="stat-jobs">۰</b><span>آگهی فعال</span></div>
        <div class="stat"><b id="stat-new">۰</b><span>آگهی جدید</span></div>
        <div class="stat"><b id="stat-cos">۰</b><span>شرکت کارفرما</span></div>
        <div class="stat"><b id="stat-views">۰</b><span>بازدید آگهی‌ها</span></div>
      </section>

      <div class="section-head">
        <h1>تازه‌ترین آگهی‌ها <small id="result-count"></small></h1>
        <button class="chip" data-clear type="button">پاک کردن جستجو</button>
      </div>
      <div class="chips" id="cat-chips"></div>
      <div id="feed"></div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
