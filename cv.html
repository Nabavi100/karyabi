<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رزومه | کارجوی هرات</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="cv">
    <main class="wrap">
      <div class="page-hero">
        <h1>ساخت رزومه</h1>
        <p>مشخصات خود را ثبت کنید تا کارفرمایان هرات راحت‌تر با شما تماس بگیرند.</p>
      </div>
      <form class="form-card" id="cv-form">
        <div class="row">
          <div>
            <label>نام کامل</label>
            <input name="name" required />
          </div>
          <div>
            <label>شماره تماس</label>
            <input name="phone" required />
          </div>
        </div>
        <div class="row">
          <div>
            <label>رشته / تخصص</label>
            <input name="field" placeholder="مثلاً حسابداری" />
          </div>
          <div>
            <label>سال تجربه</label>
            <input name="years" placeholder="مثلاً ۳ سال" />
          </div>
        </div>
        <label>تحصیلات</label>
        <input name="edu" placeholder="لیسانس حسابداری — پوهنتون هرات" />
        <label>مهارت‌ها</label>
        <input name="skills" placeholder="Excel، Word، حسابداری" />
        <label>درباره شما</label>
        <textarea name="about" placeholder="خلاصه سوابق کاری"></textarea>
        <button type="submit">ذخیره رزومه</button>
        <p class="note">رزومه روی همین دستگاه ذخیره می‌شود.</p>
      </form>
    </main>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
