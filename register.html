<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ثبت‌نام | کارجوی هرات</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="register">
    <main class="wrap">
      <div class="auth-wrap">
        <div class="page-hero">
          <h1>ثبت‌نام</h1>
          <p>به‌عنوان کارجو یا کارفرما عضو شوید.</p>
        </div>
        <form class="form-card" id="register-form">
          <label>نام کامل</label>
          <input name="name" required />
          <label>شماره تماس</label>
          <input name="phone" required />
          <label>نقش شما</label>
          <select name="role">
            <option>کارجو</option>
            <option>کارفرما</option>
          </select>
          <label>رمز عبور</label>
          <input name="pass" type="password" required />
          <button type="submit">ایجاد حساب</button>
          <p class="note">قبلاً عضو هستید؟ <a href="login.html">وارد شوید</a></p>
        </form>
      </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
  </body>
</html>
